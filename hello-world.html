<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A polished, animated Hello World welcome page." />
    <title>Hello, World!</title>
    <style>
      :root { color-scheme: dark; --ink:#f7f7ff; --muted:#c9c9e8; --panel:rgb(21 22 47 / 62%); --border:rgb(255 255 255 / 18%); --accent-2:#22d3ee; }
      * { box-sizing: border-box; }
      body { min-block-size:100vh; margin:0; display:grid; place-items:center; overflow:hidden; padding:1.5rem; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--ink); background:#0a0b1d; }
      .orb { position:fixed; z-index:-1; border-radius:50%; filter:blur(10px); opacity:.75; animation:drift 14s ease-in-out infinite alternate; }
      .orb--one { width:30rem; height:30rem; background:#6d28d9; top:-13rem; left:-10rem; }
      .orb--two { width:24rem; height:24rem; background:#0891b2; right:-8rem; bottom:-9rem; animation-delay:-6s; }
      .orb--three { width:15rem; height:15rem; background:#db2777; right:18%; top:7%; animation-delay:-2s; }
      main { width:min(100%,48rem); padding:clamp(2rem,7vw,5rem); text-align:center; background:var(--panel); border:1px solid var(--border); border-radius:2rem; box-shadow:0 2rem 5rem rgb(0 0 0 / 38%),inset 0 1px 0 rgb(255 255 255 / 8%); backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px); animation:arrive .8s cubic-bezier(.2,.8,.2,1) both; }
      .eyebrow { margin:0 0 1.25rem; color:var(--accent-2); font-size:.78rem; font-weight:750; letter-spacing:.18em; text-transform:uppercase; }
      h1 { margin:0; font-size:clamp(3.2rem,12vw,7rem); line-height:.95; letter-spacing:-.07em; background:linear-gradient(120deg,#fff 15%,#c4b5fd 48%,#67e8f9 83%); -webkit-background-clip:text; background-clip:text; color:transparent; }
      p { max-width:34rem; margin:1.75rem auto 2.25rem; color:var(--muted); font-size:clamp(1rem,2.5vw,1.18rem); line-height:1.7; }
      .sparkle { color:#fde68a; text-shadow:0 0 1rem #f59e0b; }
      a { display:inline-flex; align-items:center; gap:.65rem; padding:.9rem 1.2rem; border-radius:999px; color:#101128; background:linear-gradient(100deg,#ddd6fe,#a5f3fc); box-shadow:0 .7rem 1.8rem rgb(34 211 238 / 20%); font-weight:750; text-decoration:none; transition:transform .2s ease,box-shadow .2s ease; }
      a:hover { transform:translateY(-3px); box-shadow:0 1rem 2.2rem rgb(34 211 238 / 32%); }
      a:focus-visible { outline:3px solid white; outline-offset:4px; }
      @keyframes arrive { from { opacity:0; transform:translateY(1.5rem) scale(.97); } to { opacity:1; transform:translateY(0) scale(1); } }
      @keyframes drift { to { transform:translate(3rem,2rem) scale(1.14); } }
      @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; } }
    </style>
  </head>
  <body>
    <div class="orb orb--one" aria-hidden="true"></div>
    <div class="orb orb--two" aria-hidden="true"></div>
    <div class="orb orb--three" aria-hidden="true"></div>
    <main>
      <p class="eyebrow">A small beginning</p>
      <h1>Hello, World!</h1>
      <p>A fresh page, a bright idea, and an entire universe of possibilities. <span class="sparkle" aria-label="sparkles">✦</span></p>
      <a href="#welcome" id="welcome">Let’s create something <span aria-hidden="true">→</span></a>
    </main>
  </body>
</html>
